[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"



[project]
name = "schubmult"
license = {file = "LICENSE"}
dependencies = [
        "numpy",
        "joblib",
        "latex2sympy2_extended",
        "PuLP>=2.7.0,<4",  # PuLP 4 (Rust rewrite) drops LpVariable(name=...) and PULP_CBC_CMD
        "symengine>=0.14.1",
        "sympy>=1.14.0",
        "psutil",
        "cachetools",
        "setuptools"
]
requires-python = ">=3.10"
authors = [
  {name = "Matt Samuel", email = "schubmult@gmail.com"},
]
maintainers = [
  {name = "Matt Samuel", email = "schubmult@gmail.com"},
]
description = "Package for algebraic computation with single, double, and quantum Schubert polynomials"
readme = "README.md"
keywords = ["Schubert", "polynomial", "double", "algebra"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
]
dynamic = ["version"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "tests",
]

# Same as Black.
line-length = 200
indent-width = 4

# Oldest supported Python (matches requires-python and the CI matrix)
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "YTT",
    "COM",
    "C4",
    "DTZ",
    "ISC",
    "ICN",
    "PIE",
    "PT",
    "RET",
    "TID",
    "ARG",
    "PLE",
    "PLW",
    "RUF",
    "T201"
]
ignore = [
    "E741",
    "RUF003",
    "N806",
    "D105",
    "PLW1641",  # isinstance(x, (A, B)) is faster than A | B; rule is deprecated upstream
    "D107",
    "D203",
    "D212",
    "UP006",
    "UP007",
    "D400",
    "D406",
    "D407",
    "PLC1901",
    "UP035",
    "ARG005",
    "PLW2901",
    "T201",
    "RET504",
    "RUF002",
    "E501",
    "TID252",
    "RUF001"
]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"test*.py" = ["ALL"]
"src/schubmult/_scripts/*" = ["ALL"]
"src/schubmult/rings/*rc_graph_module.py" = ["ALL"]
"src/schubmult/rings/GOOD*" = ["ALL"]
"!src/*" = ["ALL"]
"tst*.py" = ["ALL"]
"mul_grass.py" = ["ALL"]
"working*.py" = ["ALL"]
"schubmult_*.py" = ["T201"]
"argparse.py" = ["T201"]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["src/schubmult"]
omit = [
    "*/tests/*",
    "tests/*",
    "test_*.py",
    "*_test.py"
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.0"]
docs = ["pydoc-markdown>=4.8", "mkdocs>=1.6", "mkdocs-material>=9.5"]


[project.urls]
Homepage = "http://schubmult.org"
Repository = "https://github.com/matthematics/schubmult"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["schubmult*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["_lscripts*", "writing*"]
namespaces = false

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[tool.setuptools_scm]
version_file = "src/schubmult/_version.py"
fallback_version = "5.1.0"

[project.scripts]
schubmult_py = "schubmult._scripts.schubmult_py:main"
grothmult_py = "schubmult._scripts.grothmult_py:main"
schubmult_double = "schubmult._scripts.schubmult_double:main"
grothmult_double = "schubmult._scripts.grothmult_double:main"
schubmult_q = "schubmult._scripts.schubmult_q:main"
grothmult_q = "schubmult._scripts.grothmult_q:main"
schubmult_q_double = "schubmult._scripts.schubmult_q_double:main"
grothmult_q_double = "schubmult._scripts.grothmult_q_double:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "-vv",
    "--capture=tee-sys",
    "--ignore=src/schubmult/utils/test_utils.py",
]
