loaders:
  - type: python
    search_path: [src]

processors:
  - type: filter
    documented_only: true
    # NOTE: skip_empty_modules must stay false -- it drops a module (its
    # docstring included) entirely once it has zero *documented members*,
    # even if the module itself has a perfectly good docstring. That broke
    # every package's __init__.py page (combinatorics/, mult/, rings/, ...)
    # since those often re-export without adding new documented functions.
    skip_empty_modules: false
  - type: smart
  - type: crossref

renderer:
  type: markdown
  insert_header_anchors: true
  render_module_header: true
