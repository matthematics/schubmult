name: Wrong result
description: A computation returns something mathematically incorrect (or you suspect it does).
title: "[wrong result] "
labels: ["bug", "math"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks -- these are the most valuable reports. Please give the smallest input that shows the
        problem and what you compared it against. Keep in mind the conventions before filing:
        variables are 1-indexed in Python (`x_1, y_1`) and 0-indexed in Sage (`x0, y_0`);
        the K-theoretic bases of `PolynomialAlgebra` are at `beta = -1` while the Grothendieck rings
        keep `beta` symbolic; double Grothendieck polynomials use `x (+) y = x + y + beta*x*y`.
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: Code (or the command line) that produces the result. Include imports.
      render: python
      placeholder: |
        from schubmult import DSx
        DSx([1, 3, 2]) * DSx([1, 3, 2])
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What schubmult returned
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
      description: A hand computation, a reference (paper, theorem, example number), or another system's output.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Schubert (Sx) / double Schubert (DSx)
        - quantum / quantum double (QSx, QDSx) or parabolic (QPSx, QPDSx)
        - Grothendieck (Gx, DGx)
        - polynomial bases (key, slide, forest, glide, Lascoux, grove, elementary)
        - free algebra / coproducts
        - combinatorics (permutations, RC graphs, BPDs, tableaux, crystals)
        - SageMath layer (schubmult.sage)
        - command-line scripts
        - positivity (--display-positive)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: schubmult version
      description: "`python -c 'import schubmult; print(schubmult.__version__)'` (or `pip show schubmult`)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and the SageMath version if the Sage layer is involved.
      placeholder: Python 3.12, Linux, Sage 10.9 (conda-forge)
