name: Deploy docs

# Docs track releases: build on release tags (bare versions like 5.1.1), never on branch pushes,
# so the published site never reports a setuptools-scm dev version.
on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm version
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[docs]
      - name: Refuse to publish docs for a dev version
        run: |
          VERSION=$(python -c "from importlib.metadata import version; print(version('schubmult'))")
          echo "schubmult $VERSION"
          case "$VERSION" in
            *.dev*|*+*) echo "::error::$VERSION is not a release version; run this workflow from a release tag"; exit 1 ;;
          esac
      - name: Regenerate API reference
        run: python docs/generate_docs.py
      - name: Build site
        run: mkdocs build --site-dir site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
