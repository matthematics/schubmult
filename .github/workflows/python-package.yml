# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main", "redevelop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff==0.11.0 pytest pytest-xdist build
        # Editable install; compiles the schubmult_cpp extension (MSVC / clang / gcc)
        python -m pip install -e .
    - name: Check the extension loaded
      run: python -c "from schubmult import schubmult_cpp; print(schubmult_cpp.__file__, schubmult_cpp.MAXN)"
    - name: Lint with ruff
      if: runner.os == 'Linux'
      run: |
        # Run ruff linter with your local configuration from pyproject.toml
        ruff check . --config pyproject.toml
    - name: Test with pytest
      run: |
        # one worker per runner core (4 on ubuntu/windows, 3 on macos); tests are independent
        pytest tests/ -v -n auto
    - name: Build package
      if: runner.os == 'Linux'
      run: |
        python -m build
    - name: Upload build artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.python-version }}
        path: dist/
        retention-days: 30
