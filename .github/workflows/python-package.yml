# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main", "redevelop" ]
  pull_request:
    branches: [ "main", "redevelop" ]

jobs:
   # `main` only receives final releases from `redevelop` (or a `hotfix/*` branched from main).
  # This check is required by the `main` ruleset, so a PR opened against `main` by mistake
  # (e.g. `gh pr create` defaulting to the default branch) cannot be merged.
  guard-main-base:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only redevelop or hotfix/* may target main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            redevelop|hotfix/*) echo "ok: $HEAD_REF -> main" ;;
            *) echo "::error::PRs into main must come from redevelop or hotfix/*, not '$HEAD_REF'. Retarget with: gh pr edit ${{ github.event.pull_request.number }} --base redevelop"; exit 1 ;;
          esac

  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff==0.11.0 pytest pytest-xdist build
        # Editable install; compiles the schubmult_cpp extension (MSVC / clang / gcc)
        python -m pip install -e .
    - name: Check the extension loaded
      run: python -c "from schubmult import schubmult_cpp; print(schubmult_cpp.__file__, schubmult_cpp.MAXN)"
    - name: Lint with ruff
      if: runner.os == 'Linux'
      run: |
        # Run ruff linter with your local configuration from pyproject.toml
        ruff check . --config pyproject.toml
    - name: Test with pytest
      run: |
        # one worker per runner core (4 on ubuntu/windows, 3 on macos); tests are independent
        pytest tests/ -v -n auto
    - name: Build package
      if: runner.os == 'Linux'
      run: |
        python -m build
    - name: Upload build artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.python-version }}
        path: dist/
        retention-days: 30

  # The optional SageMath integration (schubmult.sage). Sage is never a dependency of the package
  # itself (tests/test_api_surface.py::test_package_is_fully_usable_without_sage guards that), so
  # this runs once, outside the OS/Python matrix, against conda-forge's Sage.
  sage-doctests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm version
    - name: Set up SageMath (conda-forge)
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: sage
        create-args: >-
          python=3.12
          sage
          pytest
          cxx-compiler
        cache-environment: true
    - name: Install schubmult into the Sage environment
      shell: bash -el {0}
      run: python -m pip install -e .
    - name: Sage doctests for schubmult.sage
      shell: bash -el {0}
      run: python -m sage.doctest --force-lib src/schubmult/sage
    - name: Sage property tests
      shell: bash -el {0}
      run: pytest tests/sage -q
    - name: Package stays Sage-free
      shell: bash -el {0}
      run: pytest tests/test_api_surface.py -k "without_sage or module_imports_in_isolation" -q
